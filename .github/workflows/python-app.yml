# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2
    - name: Build CI Docker image
      run: |
        docker build -t monkeytype-analysis-ci:${{ github.sha }} .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        docker run --rm monkeytype-analysis-ci:${{ github.sha }} flake8 . --exclude .venv,venv --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        docker run --rm monkeytype-analysis-ci:${{ github.sha }} flake8 . --exclude .venv,venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest (trusted push only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker run --rm -e GITHUB_TOKEN monkeytype-analysis-ci:${{ github.sha }} pytest -vv
      env:
        GITHUB_TOKEN: ${{ secrets.MT_GITHUB_TOKEN }}
        
