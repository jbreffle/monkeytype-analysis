[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeytype-analysis"
version = "0.1.0"
description = "In-depth analysis and modeling of monkeytype typing data."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "awswrangler",
    "boto3==1.34.39",
    "hyperopt",
    "setuptools<81",
    "matplotlib<3.9.0",
    "mpld3",
    "numpy",
    "pandas",
    "pyarrow",
    "pyprojroot",
    "python-dotenv",
    "PyYAML",
    "requests",
    "s3fs",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "streamlit",
    "torch",
]

[dependency-groups]
dev = [
    "flake8",
    "pytest",
]
notebooks = [
    "ipykernel",
    "jupyter",
]

[tool.setuptools]
packages = ["src"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
